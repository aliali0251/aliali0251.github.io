name: علی منصوریار
role: طراح وب و سازنده پروژه‌های دیجیتال با هوش مصنوعی
intro: علاقه‌مند به طراحی وب، هوش مصنوعی و ساخت پروژه‌های دیجیتال؛ در مسیر
  یادگیری، تجربه و توسعه ایده‌ها با کمک ابزارهای هوشمند.
about: >
  من علی منصوریار هستم؛ علاقه‌مند به دنیای وب، هوش مصنوعی و فناوری‌های نوین. در
  پروژه‌هایم از ابزارهای هوش مصنوعی برای ایده‌پردازی، طراحی، ساخت و بهبود
  وب‌سایت‌ها و راهکارهای دیجیتال کمک می‌گیرم. در کنار کار با وردپرس، طراحی سایت،
  مدیریت هاست و سرور و تولید محتوا، همواره در حال یادگیری و گسترش مهارت‌هایم
  هستم. هدفم ساخت تجربه‌های دیجیتال کاربردی، یادگیری مستمر و تبدیل ایده‌ها به
  پروژه‌های واقعی است.
