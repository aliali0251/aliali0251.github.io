<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title }} | {{ site.title }}</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#0d111b;color:#f4f6fb;font-family:Vazirmatn,Tahoma,sans-serif;line-height:2}.wrap{max-width:850px;margin:60px auto;padding:24px}.back{color:#a99cff;text-decoration:none}.cover{width:100%;max-height:420px;object-fit:cover;border-radius:20px}h1{font-size:38px}.muted{color:#a4aec0}.body{background:#151b29;padding:28px;border-radius:20px;margin-top:25px}</style></head><body><main class="wrap"><a class="back" href="{{ '/' | relative_url }}">← بازگشت به صفحه اصلی</a><p class="muted">{{ page.category }} · {{ page.date | date: "%Y/%m/%d" }}</p><h1>{{ page.title }}</h1>{% if page.cover and page.cover != "" %}<img class="cover" src="{{ page.cover | relative_url }}" alt="{{ page.title }}">{% endif %}<p class="muted">{{ page.summary }}</p><article class="body">{{ content }}</article>{% if page.url and page.url != "" %}<p><a class="back" href="{{ page.url }}">مشاهده وب‌سایت پروژه ↗</a></p>{% endif %}</main></body></html>
